<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wholesale Crackers & Inventory Locator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #141b2d;
      --card-border: rgba(255, 215, 0, 0.15);
      --card-hover-border: rgba(255, 180, 0, 0.6);
      --accent-gold: #ffbe3b;
      --accent-cyan: #38bdf8;
      --accent-green: #4ade80;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 50px;
    }

    header {
      background: radial-gradient(circle at top, #1f2a48 0%, var(--bg-color) 80%);
      padding: 35px 20px 25px;
      text-align: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.4rem;
      color: var(--accent-gold);
      margin-bottom: 8px;
      text-shadow: 0 0 20px rgba(255, 190, 59, 0.3);
    }

    header p {
      color: var(--text-muted);
      font-size: 1rem;
      max-width: 650px;
      margin: 0 auto 12px;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(34, 197, 94, 0.12);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.3);
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 600;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 8px #22c55e;
      animation: pulse 1.6s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    .controls-container {
      max-width: 1240px;
      margin: 25px auto 15px;
      padding: 0 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }

    .search-box {
      flex: 1 1 320px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 13px 18px 13px 44px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background-color: #121829;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.25s ease;
    }

    .search-box input:focus {
      border-color: var(--accent-gold);
      box-shadow: 0 0 15px rgba(255, 190, 59, 0.2);
    }

    .search-box svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      fill: var(--text-muted);
      width: 18px;
      height: 18px;
    }

    .filters-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    select {
      background-color: #121829;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.9rem;
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s ease;
    }

    select:focus {
      border-color: var(--accent-gold);
    }

    .status-bar {
      max-width: 1240px;
      margin: 0 auto 20px;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 22px;
      max-width: 1240px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5);
      border-color: var(--card-hover-border);
    }

    .card-img-container {
      width: 100%;
      height: 180px;
      position: relative;
      background: #0f1523;
      overflow: hidden;
    }

    .card-img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.35s ease;
    }

    .card:hover .card-img-container img {
      transform: scale(1.05);
    }

    .brand-tag {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(11, 15, 25, 0.88);
      color: var(--accent-gold);
      padding: 4px 9px;
      border-radius: 16px;
      font-size: 0.72rem;
      font-weight: 600;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 190, 59, 0.25);
    }

    .sno-tag {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      font-size: 0.72rem;
      padding: 3px 8px;
      border-radius: 6px;
    }

    .card-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-category {
      font-size: 0.75rem;
      color: #f97316;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.35;
      margin-bottom: 8px;
      min-height: 42px;
    }

    .location-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(56, 189, 248, 0.12);
      color: var(--accent-cyan);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      width: fit-content;
      margin-bottom: 12px;
    }

    .location-badge.empty {
      background: rgba(156, 163, 175, 0.1);
      color: var(--text-muted);
      border-color: rgba(156, 163, 175, 0.2);
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .price-value {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--accent-green);
    }

    .btn-view {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border: none;
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
    }

    .card:hover .btn-view {
      background: var(--accent-gold);
      color: #0b0f19;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 20px;
    }

    .modal-overlay.active { display: flex; }

    .modal-content {
      background: #141c2f;
      border: 1px solid var(--accent-gold);
      border-radius: 20px;
      width: 100%;
      max-width: 480px;
      overflow: hidden;
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0, 0, 0, 0.65);
      border: none;
      color: #fff;
      font-size: 1.4rem;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      cursor: pointer;
    }

    .modal-img {
      width: 100%;
      height: 230px;
      object-fit: cover;
    }

    .modal-body { padding: 22px; }
    .modal-title { font-size: 1.4rem; color: #fff; margin-bottom: 6px; }

    .modal-meta-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .modal-price-box {
      background: rgba(74, 222, 128, 0.1);
      border: 1px solid rgba(74, 222, 128, 0.3);
      padding: 14px;
      border-radius: 12px;
      text-align: center;
      margin-top: 12px;
    }

    .modal-price-box .amt {
      font-size: 1.9rem;
      font-weight: 800;
      color: var(--accent-green);
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top: 4px solid var(--accent-gold);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <header>
    <h1>✨ Wholesale Crackers Live Catalog ✨</h1>
    <p>Live inventory & stock locator synchronized automatically with Google Sheets.</p>
    <div class="live-badge">
      <div class="live-dot"></div> Auto-Syncing Active
    </div>
  </header>

  <div class="controls-container">
    <div class="search-box">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input type="text" id="searchInput" placeholder="Search product, company, or location (e.g. Rack A1)..." />
    </div>

    <div class="filters-group">
      <select id="companyFilter"><option value="ALL">All Companies</option></select>
      
      <select id="locationFilter"><option value="ALL">All Locations</option></select>

      <select id="categoryFilter">
        <option value="ALL">All Categories</option>
        <option value="Flower Pots">Flower Pots</option>
        <option value="Ground Chakkars">Ground Chakkars</option>
        <option value="Multi Shots / Aerial">Multi Shots / Aerial</option>
        <option value="Sound Bombs">Sound Bombs & Crackers</option>
        <option value="Sparklers & Pencils">Sparklers & Pencils</option>
        <option value="Rockets">Rockets</option>
        <option value="Gift Box">Gift Boxes</option>
        <option value="Bijili">Bijili Crackers</option>
        <option value="General">Other Novelties</option>
      </select>

      <select id="sortFilter">
        <option value="default">Default Order</option>
        <option value="price-asc">Price: Low to High</option>
        <option value="price-desc">Price: High to Low</option>
        <option value="name-asc">Name: A to Z</option>
      </select>
    </div>
  </div>

  <div class="status-bar">
    <span id="productCount">Auto-connecting to Google Sheet...</span>
    <span id="lastUpdated"></span>
  </div>

  <div class="products-grid" id="productsGrid">
    <div class="empty-state">
      <div class="spinner"></div>
      <p>Synchronizing directly with Google Sheets...</p>
    </div>
  </div>

  <!-- Detail Modal -->
  <div class="modal-overlay" id="productModal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()">&times;</button>
      <img id="modalImg" class="modal-img" src="" alt="Cracker Image" />
      <div class="modal-body">
        <div id="modalCategory" class="card-category"></div>
        <h2 id="modalTitle" class="modal-title"></h2>
        <div class="modal-meta-row">
          <span>Brand / Company:</span>
          <strong id="modalCompany" style="color: var(--accent-gold);"></strong>
        </div>
        <div class="modal-meta-row">
          <span>Storage Location / Place:</span>
          <strong id="modalLocation" style="color: var(--accent-cyan);"></strong>
        </div>
        <div class="modal-meta-row">
          <span>Item Code / S.No:</span>
          <strong id="modalSNo" style="color: #fff;"></strong>
        </div>
        <div class="modal-price-box">
          <div style="font-size: 0.8rem; color: #9ca3af; text-transform: uppercase;">Wholesale Price</div>
          <div class="amt" id="modalPrice"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SPREADSHEET_ID = "1HfN8xSMzq-mUnLg-t6-yprV-wTkyn6V2N6G37T339SU";
    const AUTO_SYNC_INTERVAL_MS = 10000; // Polls sheet every 10 seconds

    let allProducts = [];
    let previousRawHash = "";

    const categoryFallbackImages = {
      "Flower Pots": "https://images.unsplash.com/photo-1514565131-fce0801e5785?w=600&auto=format&fit=crop&q=80",
      "Ground Chakkars": "https://images.unsplash.com/photo-1533230628206-896898d24ce4?w=600&auto=format&fit=crop&q=80",
      "Multi Shots / Aerial": "https://images.unsplash.com/photo-1498931299472-f7a63a5a1cfa?w=600&auto=format&fit=crop&q=80",
      "Sound Bombs": "https://images.unsplash.com/photo-1531306728370-e2ebd9d7bb99?w=600&auto=format&fit=crop&q=80",
      "Sparklers & Pencils": "https://images.unsplash.com/photo-1508672019048-805c876b67e2?w=600&auto=format&fit=crop&q=80",
      "Rockets": "https://images.unsplash.com/photo-1467810563316-b5476525c0f9?w=600&auto=format&fit=crop&q=80",
      "Gift Box": "https://images.unsplash.com/photo-1513297887119-d46091b24bfa?w=600&auto=format&fit=crop&q=80",
      "Bijili": "https://images.unsplash.com/photo-1577744168855-46761c77f005?w=600&auto=format&fit=crop&q=80",
      "General": "https://images.unsplash.com/photo-1530103862676-de8c9debad1d?w=600&auto=format&fit=crop&q=80"
    };

    function getCategory(name, company) {
      name = (name || "").toLowerCase();
      company = (company || "").toLowerCase();

      if (name.includes("flower") || name.includes("koti")) return "Flower Pots";
      if (name.includes("gc") || name.includes("chaker") || name.includes("spinner")) return "Ground Chakkars";
      if (name.includes("short") || name.includes("shot")) return "Multi Shots / Aerial";
      if (name.includes("bomb") || name.includes("sound") || name.includes("lakshmi")) return "Sound Bombs";
      if (name.includes("pencil") || name.includes("star") || name.includes("uv")) return "Sparklers & Pencils";
      if (name.includes("rocket") || name.includes("lunik")) return "Rockets";
      if (company.includes("gift box") || name.includes("items") || name.includes("pack")) return "Gift Box";
      if (company.includes("bijili") || name.includes("bijili")) return "Bijili";
      return "General";
    }

    // Google Drive direct view link converter (if user pastes drive sharing link)
    function sanitizeImageUrl(url) {
      if (!url || typeof url !== 'string') return "";
      url = url.trim();
      if (url.includes("drive.google.com/file/d/")) {
        const match = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
        if (match && match[1]) {
          return `https://drive.google.com/thumbnail?id=${match[1]}&sz=w800`;
        }
      }
      return url;
    }

    // JSONP Callback: Reads columns A to F
    window.handleGoogleSheetData = function(json) {
      if (!json || !json.table || !json.table.rows) return;

      const rawString = JSON.stringify(json.table.rows);
      if (rawString === previousRawHash && allProducts.length > 0) {
        return; // Skip re-render if data has not changed
      }
      previousRawHash = rawString;

      let currentCompany = "General";
      const newItems = [];

      json.table.rows.forEach((row, index) => {
        const c = row.c || [];

        let sno = c[0] && c[0].v != null ? c[0].v : (index + 1);
        let company = c[1] && c[1].v != null ? String(c[1].v).trim() : "";
        let product = c[2] && c[2].v != null ? String(c[2].v).trim() : "";
        let price = c[3] && c[3].v != null ? parseFloat(c[3].v) : 0;
        
        // Column E: Location / Place
        let location = c[4] && c[4].v != null ? String(c[4].v).trim() : "";
        
        // Column F: Image URL
        let customImage = c[5] && c[5].v != null ? String(c[5].v).trim() : "";

        if (company !== "") {
          currentCompany = company;
        }

        if (!product && company) {
          product = company;
        }

        if (product) {
          const category = getCategory(product, currentCompany);
          const validImg = sanitizeImageUrl(customImage) || categoryFallbackImages[category] || categoryFallbackImages["General"];

          newItems.push({
            sno: sno,
            company: currentCompany,
            product: product,
            price: isNaN(price) ? 0 : price,
            location: location || "Not Specified",
            image: validImg
          });
        }
      });

      allProducts = newItems;
      populateDropdowns();
      renderProducts();

      const now = new Date();
      document.getElementById("lastUpdated").textContent = `Auto-synced: ${now.toLocaleTimeString()}`;
    };

    function triggerAutoSync() {
      const existingScript = document.getElementById("gviz-jsonp-script");
      if (existingScript) existingScript.remove();

      const script = document.createElement("script");
      script.id = "gviz-jsonp-script";
      script.src = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=responseHandler:handleGoogleSheetData&_nocache=${Date.now()}`;
      
      script.onerror = function() {
        console.error("Failed to load Google Sheet via JSONP.");
        if (allProducts.length === 0) {
          document.getElementById("productsGrid").innerHTML = `
            <div class="empty-state">
              <h3 style="color: #ff4d4f; margin-bottom: 8px;">Could not connect to Google Sheet</h3>
              <p>Make sure the spreadsheet permission is set to <strong>Anyone with the link (Viewer)</strong>.</p>
            </div>
          `;
          document.getElementById("productCount").textContent = "Connection failed";
        }
      };

      document.head.appendChild(script);
    }

    function populateDropdowns() {
      // Companies
      const companySelect = document.getElementById("companyFilter");
      const currentCompany = companySelect.value;
      const companies = [...new Set(allProducts.map(p => p.company))].sort();

      companySelect.innerHTML = `<option value="ALL">All Companies</option>`;
      companies.forEach(c => {
        const opt = document.createElement("option");
        opt.value = c;
        opt.textContent = c;
        companySelect.appendChild(opt);
      });
      if (companies.includes(currentCompany)) companySelect.value = currentCompany;

      // Locations
      const locationSelect = document.getElementById("locationFilter");
      const currentLoc = locationSelect.value;
      const locations = [...new Set(allProducts.map(p => p.location).filter(l => l !== "Not Specified"))].sort();

      locationSelect.innerHTML = `<option value="ALL">All Locations</option>`;
      locations.forEach(loc => {
        const opt = document.createElement("option");
        opt.value = loc;
        opt.textContent = `📍 ${loc}`;
        locationSelect.appendChild(opt);
      });
      if (locations.includes(currentLoc)) locationSelect.value = currentLoc;
    }

    function renderProducts() {
      const grid = document.getElementById("productsGrid");
      const searchInput = document.getElementById("searchInput");
      const companySelect = document.getElementById("companyFilter");
      const locationSelect = document.getElementById("locationFilter");
      const categorySelect = document.getElementById("categoryFilter");
      const sortSelect = document.getElementById("sortFilter");
      const countDisplay = document.getElementById("productCount");

      const query = searchInput.value.trim().toLowerCase();
      const selectedCompany = companySelect.value;
      const selectedLocation = locationSelect.value;
      const selectedCategory = categorySelect.value;
      const sortBy = sortSelect.value;

      let filtered = allProducts.filter(item => {
        const cat = getCategory(item.product, item.company);
        const matchesQuery = item.product.toLowerCase().includes(query) ||
                             item.company.toLowerCase().includes(query) ||
                             item.location.toLowerCase().includes(query);
        const matchesCompany = (selectedCompany === "ALL") || (item.company === selectedCompany);
        const matchesLocation = (selectedLocation === "ALL") || (item.location === selectedLocation);
        const matchesCat = (selectedCategory === "ALL") || (cat === selectedCategory);
        return matchesQuery && matchesCompany && matchesLocation && matchesCat;
      });

      if (sortBy === "price-asc") {
        filtered.sort((a, b) => a.price - b.price);
      } else if (sortBy === "price-desc") {
        filtered.sort((a, b) => b.price - a.price);
      } else if (sortBy === "name-asc") {
        filtered.sort((a, b) => a.product.localeCompare(b.product));
      }

      countDisplay.textContent = `Showing ${filtered.length} of ${allProducts.length} items`;

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <h3>No products found</h3>
            <p>Try modifying your search or filters.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered.map(item => {
        const cat = getCategory(item.product, item.company);
        const hasLocation = item.location !== "Not Specified";
        return `
          <div class="card" onclick="openModal('${item.sno}', '${encodeURIComponent(item.product)}')">
            <div class="card-img-container">
              <span class="brand-tag">${item.company}</span>
              <span class="sno-tag">#${item.sno}</span>
              <img src="${item.image}" alt="${item.product}" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1530103862676-de8c9debad1d?w=600&auto=format&fit=crop&q=80'" />
            </div>
            <div class="card-body">
              <div class="card-category">${cat}</div>
              <div class="card-title">${item.product}</div>
              <div class="location-badge ${hasLocation ? '' : 'empty'}">
                📍 ${item.location}
              </div>
              <div class="card-footer">
                <div>
                  <span style="font-size: 0.72rem; color: #9ca3af; text-transform: uppercase;">Wholesale</span>
                  <div class="price-value">₹${item.price.toFixed(2)}</div>
                </div>
                <button class="btn-view">Details</button>
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    const modal = document.getElementById("productModal");
    function openModal(sno, encodedProduct) {
      const productName = decodeURIComponent(encodedProduct);
      const item = allProducts.find(p => String(p.sno) === String(sno) && p.product === productName);
      if (!item) return;

      const cat = getCategory(item.product, item.company);
      document.getElementById("modalImg").src = item.image;
      document.getElementById("modalCategory").textContent = cat;
      document.getElementById("modalTitle").textContent = item.product;
      document.getElementById("modalCompany").textContent = item.company;
      document.getElementById("modalLocation").textContent = item.location;
      document.getElementById("modalSNo").textContent = `#${item.sno}`;
      document.getElementById("modalPrice").textContent = `₹${item.price.toFixed(2)}`;

      modal.classList.add("active");
    }

    function closeModal() { modal.classList.remove("active"); }
    modal.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });

    document.getElementById("searchInput").addEventListener("input", renderProducts);
    document.getElementById("companyFilter").addEventListener("change", renderProducts);
    document.getElementById("locationFilter").addEventListener("change", renderProducts);
    document.getElementById("categoryFilter").addEventListener("change", renderProducts);
    document.getElementById("sortFilter").addEventListener("change", renderProducts);

    // Initial autonomous sync on load
    triggerAutoSync();

    // Auto-polling every 10 seconds in the background
    setInterval(triggerAutoSync, AUTO_SYNC_INTERVAL_MS);
  </script>
</body>
</html>
